# HallOfFrame — Finish-Line Timer example configuration.
#
# Copy this file to your data root (default `~/regatta-data/config.toml`) and
# edit it. The application NEVER writes config.toml: everything machine-produced
# (the latency calibration result) lives in calibration.json, and delta is
# derived at race start. See spec §8 and INSTALL.md §6.
#
#   mkdir -p ~/regatta-data
#   cp hallofframe.example.toml ~/regatta-data/config.toml
#   $EDITOR ~/regatta-data/config.toml
#
# Most values below are the application's built-in defaults, so a straight copy
# runs; the [trigger] device paths are machine-specific and must match this
# laptop's devices (check /dev/input/by-id/ and /dev/input/by-path/).

[paths]
data_root = "~/regatta-data"   # everything (§6.7) is relative to this; the
                               # directory NAME is arbitrary — set it to any path,
                               # e.g. "$HOME/regatta-data". config.toml
                               # itself must live in this directory.
# Competition/event name. All generated data (the SQLite database, per-event
# log files and the default roster CSV) carry this name instead of a generic
# one, e.g. event_name = "EVENT_2026" -> <data_root>/EVENT_2026.db,
# <data_root>/logs/EVENT_2026-app.jsonl, <data_root>/EVENT_2026_races.csv.
event_name = "event"

[transport]
# enabled = false skips the USB tunnel entirely (no iproxy, no device check), so
# [stream] url can point at any network source — e.g. the fake camera in
# tools/fake_camera.py — and the app runs unchanged. True is the phone-over-USB
# path. See plan step 7.4.
enabled = true
local_port = 8081
device_port = 8081
udid = ""                    # empty = first device found
iproxy_path = "iproxy"
max_restarts_idle = 3        # outside a race
max_restarts_racing = 0      # 0 = unlimited with backoff (§6.5)

[stream]
# Path and ports are app- and version-dependent (spec §8, §9.2). The default
# /video was verified on IP Camera Lite (2026-08-22); confirm in the iOS app.
url = "http://127.0.0.1:8081/video"
username = "admin"
password = "admin"
buffer_seconds = 10.0
assumed_fps = 30             # MUST match the phone's actual fps (§6.3)
require_content_length = true

[timing]
viewing_mode = "water"       # "water" | "screen" — selects the delta formula (§5.4)
reaction_offset_ms = 0.0     # operator-tuned component
debounce_ms = 20             # suspect presses are RECORDED and flagged (§6.4)
start_mode = "direct"        # "direct" | "radio" | "external" (§5.3.1)
radio_delay_ms = 0.0         # measured; only meaningful when start_mode="radio"
image_mode = "auto"          # "auto" | "off" — off = timing-only, no camera (§6.5)
# Delta itself is NOT stored here. It is derived at race start from
# calibration.json + reaction_offset_ms. See §5.4 and §6.7.

[capture]
window_before_ms = 500       # milliseconds, not frames — fps-independent (§6.5)
window_after_ms = 500

[trigger]
# device_path empty = Qt fallback; otherwise the evdev device to grab, e.g.
# /dev/input/event3 (the internal keyboard). grab_device = true is required if
# using the internal keyboard as the trigger (§6.4). Keycodes are the evdev
# numeric codes: SPACE=57, ENTER=28, F12=88. Prefer the stable
# /dev/input/by-id/... path for a USB button so it survives a replug.
device_path = "/dev/input/by-id/usb-LinTx_USB_Keyboard_BF5AEDB1-if01-event-kbd"
# Optional second evdev device that handles ONLY the end keycodes and is NEVER
# grabbed, so Qt keeps receiving typing (e.g. future boat-number entry) while
# the timing device is grabbed during a race. Empty string = single-device
# behaviour (end handled on device_path too). Point it at the laptop keyboard
# (stable by-path) so the scratchpad keeps receiving typed digits (§13.3).
end_device_path = "/dev/input/by-path/platform-i8042-serio-0-event-kbd"
crossing_keycodes = [28]     # KEY_ENTER — LinTx USB button
start_keycodes = [28]        # KEY_ENTER — single-key: 1st press = t0, each later press = crossing
end_keycodes = [88]          # KEY_F12 — finish the race (§6.4)
# Single-key flow (§5.3): list the SAME keycode in both crossing_keycodes and
# start_keycodes. The first press while armed starts the race (t0); every later
# press is a crossing. E.g. a one-key pad emitting KEY_1 (code 2):
#   crossing_keycodes = [2]
#   start_keycodes = [2]
grab_device = true

[races]
# Relative paths are resolved under data_root; "{event_name}" is substituted
# from [paths]. Default: <data_root>/<event_name>_races.csv
csv_path = "{event_name}_races.csv"

[ui]
finish_line_x = 0.5          # normalised 0..1 position of the overlay
preview_fps = 10

[web]
# Optional separate-process HTTP results server (README "Live results"). It opens
# its OWN read-only SQLite connection and serves only pre-rendered HTML + files
# already on disk, so viewer load never perturbs the timing thread. Runs with:
#   <venv>/bin/python -m hallofframe.web --config <data_root>/config.toml
enabled = true               # false = the server refuses to start
host = "127.0.0.1"           # localhost only; "0.0.0.0" exposes it on the LAN
port = 8080
copy_heading = true          # include the Race ID/Heat/Category/Gun block in a copied table
thumb_width = 480            # deferred-photo thumbnail width in px (spec §13.3)
thumb_quality = 75           # JPEG quality for the generated thumbnails
cache_dir = "web-cache"      # thumbnail cache, relative to data_root (absolute allowed)

[scratchpad]
enabled = true               # §13.3 live bow-number scratchpad; needs an external trigger device

[voice]
# Voice annotation — optional, off by default. R2 implements continuous
# per-race recording + review playback (spec §13.3.4); the ASR keys
# (transcribe*/model) are release 3 and unused until then.
enabled = true
input = "default"            # ALSA PCM for arecord -D ("default" = system default via PipeWire/Pulse; "plughw:1,0" for a USB headset)
output = "default"           # ALSA PCM for aplay -D (review playback); check with: aplay -L
mixer_card = ""              # amixer -c <card>; "" = default card ("amixer -c 0 scontrols" lists controls)
mixer = []                   # ["Capture 60%", "Mic Boost 0%"]: amixer sset entries applied at app start
gain_db = 0.0                # playback make-up gain (dB); clipped to int16 after gain
highpass_hz = 0.0            # playback one-pole high-pass; 0 disables (150 cuts hum/thumps)
press_mute_ms = 0            # playback: mute ±press_mute_ms/2 around t_press (button click); 0 disables
play_before_s = 3.0          # review playback window, seconds before the crossing
play_after_s = 5.0           # ... and after
# transcribe*/model: release 3 (ASR), unused until then
transcribe = false           # stage 2: local speech-to-text bow suggestions
model = "base"               # faster-whisper model name
transcribe_before_s = 1.0    # transcription window, seconds before the crossing
transcribe_after_s = 4.0     # ... and after
